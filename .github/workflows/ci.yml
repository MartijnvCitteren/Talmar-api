# Authoritative guardrail gate for every PR and every push to main.
# See docs/adr/0001-agentic-development-guardrails.md. Every third-party action is pinned by commit SHA and every
# downloaded tool by SHA-256, so a compromised upstream tag cannot change what runs here.
# Two jobs on purpose: on a private repo every job is billed rounded up to a whole minute.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump manually; Dependabot does not track these.
  CYCLONEDX_MAVEN_PLUGIN_VERSION: 2.9.3
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  OASDIFF_VERSION: 1.33.0
  OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test, check formatting and generate SBOM
        run: >-
          ./mvnw -B -ntp verify
          "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_MAVEN_PLUGIN_VERSION}:makeAggregateBom"
          -DoutputFormat=json

      - name: Install OSV-Scanner
        run: >-
          .github/scripts/install-tool.sh osv-scanner
          "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          "${OSV_SCANNER_SHA256}"

      # Scans the SBOM Maven resolved (incl. transitive dependencies); scanning pom.xml directly misses the
      # multi-module dependency graph and silently reports zero packages.
      - name: Scan dependencies for known vulnerabilities
        run: osv-scanner scan source --lockfile target/bom.json

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan and the contract comparison
          persist-credentials: false

      - name: Install gitleaks, oasdiff and actionlint
        run: |
          .github/scripts/install-tool.sh gitleaks \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}"
          .github/scripts/install-tool.sh oasdiff \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            "${OASDIFF_SHA256}"
          .github/scripts/install-tool.sh actionlint \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}"

      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner --verbose

      - name: Lint GitHub workflows and shell scripts
        run: |
          actionlint
          shellcheck .github/scripts/*.sh .claude/hooks/*.sh .githooks/pre-commit

      - name: Test agent guardrail hooks and the guardrail-diff script
        run: |
          .claude/hooks/test-hooks.sh
          .github/scripts/test-guardrail-diff.sh

      - name: Check API contract for breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-contract.sh "origin/${BASE_REF}"
