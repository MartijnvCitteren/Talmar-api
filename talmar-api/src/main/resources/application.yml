server:
  port: 8090
  servlet:
    context-path: /api/v1
spring:
  application:
    name: "Talmar"
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:default}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # @Async work (AI description generation) and the web server run on virtual threads.
  threads:
    virtual:
      enabled: true

  # Outbound HTTP clients. The only one so far is the Mistral adapter: one attempt may take at most
  # 15 seconds (ADR 0002). The JDK client reports a timeout as HttpTimeoutException, which the adapter
  # tells apart from other provider errors.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s
      imperative:
        factory: jdk

  ai:
    # Only the chat model is used; the Mistral starter would also create embedding, moderation and OCR
    # clients.
    model:
      embedding: none
      moderation: none
      ocr: none
    mistralai:
      api-key: ${MISTRAL_API_KEY}
      chat:
        model: mistral-small-latest
        # Above Mistral's recommended 0.0-0.7 for livelier vacancy texts; the JSON schema and the draft
        # validation still bound the output.
        temperature: 1.1
        max-tokens: 1000
    # Three attempts in total (max-attempts counts the retries after the first one) with a short
    # backoff, so the worst case of 3 x 15 s + 3 s stays under one minute. Spring AI's default retries
    # 10 times with up to 3 minutes between attempts. Retried: 5xx, I/O errors and, per Mistral's
    # guidance, 429 (rate limit). Every other 4xx is not retried: it fails until we fix the request.
    retry:
      max-attempts: 2
      on-http-codes: 429
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 2s

talmar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  identity:
    # Frontend page the verification mail links to; the token is appended as ?token=...
    confirmation-url: ${IDENTITY_CONFIRMATION_URL:https://talmar.eu/registration/confirm}
    # How long a verification link stays valid before the unconfirmed registration is purged.
    unconfirmed-retention: ${IDENTITY_UNCONFIRMED_RETENTION:PT48H}
    purge-interval: ${IDENTITY_PURGE_INTERVAL:PT1H}
  generation:
    # How long a description generation (and its draft) is kept before the clean-up deletes it.
    retention: PT32H
    purge-interval: PT1H

logging:
  level:
    eu.talmar: ${LOGGING_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
