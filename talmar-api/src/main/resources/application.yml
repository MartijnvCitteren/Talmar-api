server:
  port: 8090
  servlet:
    context-path: /api/v1
spring:
  application:
    name: "Talmar"
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:default}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # @Async work (AI description generation) and the web server run on virtual threads.
  threads:
    virtual:
      enabled: true

  # Outbound HTTP clients: the Mistral adapter, where one attempt may take at most 15 seconds
  # (ADR 0002), and the Keycloak adapter. The JDK client reports a timeout as HttpTimeoutException, which the adapter
  # tells apart from other provider errors.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s
      imperative:
        factory: jdk

  # Access tokens are validated against the realm's issuer; Spring fetches its keys on the first
  # request, not at startup. The issuer is the public URL in the tokens, which may differ from the
  # URL the backend uses for the Admin API.
  # The talmar-backend service account calls the Keycloak Admin API (ADR 0006, section 6). Its token
  # URI is set explicitly: with an issuer URI, Spring would call Keycloak at startup to discover it.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${talmar.keycloak.base-url}/realms/${talmar.keycloak.realm}}
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:talmar-backend}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${talmar.keycloak.base-url}/realms/${talmar.keycloak.realm}/protocol/openid-connect/token

  ai:
    # Only the chat model is used; the Mistral starter would also create embedding, moderation and OCR
    # clients.
    model:
      embedding: none
      moderation: none
      ocr: none
    mistralai:
      api-key: ${MISTRAL_API_KEY}
      chat:
        model: mistral-small-latest
        # Above Mistral's recommended 0.0-0.7 for livelier vacancy texts; the JSON schema and the draft
        # validation still bound the output.
        temperature: 1.1
        max-tokens: 1000
    # Three attempts in total (max-attempts counts the retries after the first one) with a short
    # backoff, so the worst case of 3 x 15 s + 3 s stays under one minute. Spring AI's default retries
    # 10 times with up to 3 minutes between attempts. Retried: 5xx, I/O errors and, per Mistral's
    # guidance, 429 (rate limit). Every other 4xx is not retried: it fails until we fix the request.
    retry:
      max-attempts: 2
      on-http-codes: 429
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 2s

talmar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  keycloak:
    # Keycloak as the backend reaches it; the realm that holds Talmar's accounts.
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM:talmar}
  generation:
    # How long a description generation (and its draft) is kept before the clean-up deletes it.
    retention: PT32H
    purge-interval: PT1H

logging:
  level:
    eu.talmar: ${LOGGING_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
