spring:
  datasource:
    # PostgreSQL (ADR 0007), e.g. jdbc:postgresql://<host>:5432/taldo_db?sslmode=verify-full. Spring Boot picks the
    # driver from the URL and Hibernate the dialect from the database.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  level:
    root: WARN
    eu.taldo: INFO
