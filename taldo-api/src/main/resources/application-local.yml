spring:
  datasource:
    # The postgres service of docker-compose.yaml, on host port 5433 (see there).
    url: jdbc:postgresql://localhost:5433/taldo_db
    username: postgres
    password: Super_secret-123
  security:
    oauth2:
      client:
        registration:
          keycloak-admin:
            # The local-only default of docker-compose.yaml (TALDO_BACKEND_CLIENT_SECRET).
            client-secret: ${KEYCLOAK_CLIENT_SECRET:local-only-backend-secret}

taldo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}

logging:
  level:
    eu.taldo: DEBUG
