openapi: 3.1.1
info:
  title: Talmar Identity API
  description: >
    API for accounts in Talmar. Registration, e-mail verification, login and passwords are handled by the identity
    provider (Keycloak, ADR 0006), not by this API. The onboarding of a logged-in user follows in a later version.
  version: 2.0.0
servers:
  - url: /api/v1

paths: {}

components:
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: An unexpected error occurred while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    JobRole:
      type: string
      description: The user's role, asked when they sign up. A profile field, not a right.
      enum: [RECRUITER, HIRING_MANAGER, HR, FOUNDER_OR_DIRECTOR, OTHER]

    AccountStatus:
      type: string
      description: >
        `ACTIVE`: the account can be used. `PENDING_APPROVAL`: the user joined an existing company and waits for its
        owner to approve them.
      enum: [ACTIVE, PENDING_APPROVAL]

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Extension member listing field-level validation failures, when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
