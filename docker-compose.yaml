name: taldo-infra

services:
  # PostgreSQL 17: the newest major version Scaleway Managed Database for PostgreSQL offers, so local matches the
  # hosted engine. Creates the application database (taldo_db) on the first start of an empty volume. Published on
  # host port 5433, not 5432: a PostgreSQL installed on the host (e.g. Postgres.app) takes localhost:5432 first, and
  # the backend would then silently connect to that server instead.
  postgres:
    image: postgres:17.12
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Super_secret-123"
      POSTGRES_DB: taldo_db
    ports:
      - "5433:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d taldo_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates Keycloak's database, also on a volume that already exists. PostgreSQL databases are UTF-8 by default and
  # use MVCC, so the collation and READ_COMMITTED_SNAPSHOT settings SQL Server needed are not required here.
  postgres-init:
    image: postgres:17.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: "Super_secret-123"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak_db'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE keycloak_db"
    restart: "no"

  # Identity provider (ADR 0006), development mode. The realm in docker/keycloak/ is imported on the first start
  # only; after changing it, remove the realm in the admin console or reset the volumes (docker compose down -v).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak_db"
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "Super_secret-123"
      KC_HEALTH_ENABLED: "true"
      # Read by the realm import (${...} placeholder); the backend gets the same value.
      TALDO_BACKEND_CLIENT_SECRET: ${TALDO_BACKEND_CLIENT_SECRET:-local-only-backend-secret}
      # RFC 9106's second recommended Argon2id option, as ADR 0003 chose for our own hashes: 64 MiB, 3 iterations,
      # parallelism 4. Keycloak's default is 7 MiB, 5 iterations, parallelism 1.
      KC_SPI_PASSWORD_HASHING__ARGON2__MEMORY: "65536"
      KC_SPI_PASSWORD_HASHING__ARGON2__ITERATIONS: "3"
      KC_SPI_PASSWORD_HASHING__ARGON2__PARALLELISM: "4"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/taldo-realm.json:/opt/keycloak/data/import/taldo-realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies the realm settings the import cannot express (see the script), after every start of Keycloak.
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    entrypoint: [ "/bin/bash", "/opt/keycloak/configure-realm.sh" ]
    volumes:
      - ./docker/keycloak/configure-realm.sh:/opt/keycloak/configure-realm.sh:ro
    restart: "no"

  # Local SMTP server for the mails Keycloak sends (verification, password reset). Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "8025:8025"

volumes:
  postgresdata:
    name: taldo-postgresdata
